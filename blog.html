        <h1 data-i18n="blog.title">Blog</h1>
        <p data-i18n="blog.intro">Notes on code, hardware and my Linux setup. Newest first.</p>
      </header>

      <!-- ======================================================================
           HOW TO ADD / EDIT A BLOG POST  (Markdown workflow)
           ----------------------------------------------------------------------
           Posts are now MARKDOWN files in the /blog folder — no HTML editing.

           TO ADD A POST:
             1. Create  blog/YYYY-MM-DD-my-slug.md  with front-matter on top:

                    ---
                    title: My post title
                    date: 2026-01-31
                    excerpt: One-line teaser shown in the feed.
                    ---

                    Your **Markdown** body here: ## headings, lists, `code`,
                    > quotes, [links](https://example.com) — all supported.

             2. Add it to  blog/posts.json  (newest FIRST):
                    { "file": "2026-01-31-my-slug.md" }

           OPTIONAL BILINGUAL POST:
             Make TWO files, e.g.  my-slug.en.md  and  my-slug.ar.md , then list
             them together so the right one loads with the language toggle:
                    { "en": "my-slug.en.md", "ar": "my-slug.ar.md" }
             Single-language posts just use { "file": "…" } and show as-is in
             both EN and AR. No need to translate unless you want to.

           The feed below is rendered by js/main.js (initBlog): it reads
           posts.json, fetches each file, parses front-matter + Markdown, and
           builds the cards with a working "Read more" (expands in place).

           NOTE: this needs the site served over http:// (your
           `python3 -m http.server 8000`). Opening blog.html as a file:// cannot
           fetch the .md files.
           ====================================================================== -->

      <!-- Posts get injected here. The message shows only if JS is off or the
           posts fail to load (e.g. opened as a bare file:// with no server). -->
      <div id="blog-feed" class="stack">
        <noscript><p>Enable JavaScript to read the blog posts.</p></noscript>
      </div>
